<!doctype html><html lang="pt-BR"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Central de Aprovação</title><link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap"><style id="app-css">
:root{
  --ground:#F7F9F9; --surface:#FFFFFF; --surface-2:#EFF1F0;
  --ink:#15171A; --ink-2:#4A4E4C; --muted:#82867F;
  --line:#DDE1DE; --line-strong:#C4C9C4;
  --brand:#FDC71A; --brand-ink:#15171A;
  --ok:#1E7A4C; --ok-bg:#E3F3EA;
  --warn:#9A6206; --warn-bg:#FBEFD6;
  --bad:#B4372B; --bad-bg:#FAE6E3;
  --ig-link:#00376B;
  color-scheme:light;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1112; --surface:#17191B; --surface-2:#202325;
  --ink:#F2F3F1; --ink-2:#C2C6C1; --muted:#8B8F89;
  --line:#2A2E30; --line-strong:#3B4042;
  --ok:#5FD39A; --ok-bg:#12291F;
  --warn:#F0BD58; --warn-bg:#2B2213;
  --bad:#F0867A; --bad-bg:#2C1815;
  --ig-link:#8FC4F0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0F1112; --surface:#17191B; --surface-2:#202325;
  --ink:#F2F3F1; --ink-2:#C2C6C1; --muted:#8B8F89;
  --line:#2A2E30; --line-strong:#3B4042;
  --ok:#5FD39A; --ok-bg:#12291F;
  --warn:#F0BD58; --warn-bg:#2B2213;
  --bad:#F0867A; --bad-bg:#2C1815;
  --ig-link:#8FC4F0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-family:"Archivo Black","Arial Black",system-ui,sans-serif;font-weight:400;text-wrap:balance;letter-spacing:-.01em}

.wrap{max-width:540px;margin:0 auto;padding:0 16px 140px}

/* ---- barra da agência ---- */
.agency{display:flex;align-items:center;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.mark{width:28px;height:28px;flex:none;background:var(--brand);border-radius:6px;display:grid;place-items:center;
  font-family:"Archivo Black","Arial Black",sans-serif;font-size:12px;color:#15171A;letter-spacing:-.04em}
.agency b{display:block;font-family:"Archivo Black","Arial Black",sans-serif;font-weight:400;font-size:13px;letter-spacing:.01em;line-height:1.25}
.agency span{display:block;font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600;line-height:1.3}
.agency .sp{margin-left:auto}
.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink-2);border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--ink-2);color:var(--ink)}

/* ---- cabeçalho da pauta ---- */
.pauta{padding-block:22px 6px}
.mes{display:inline-block;background:var(--brand);color:#15171A;border-radius:999px;padding:6px 15px 5px;
  font-family:"Archivo Black","Arial Black",sans-serif;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:11px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pauta h1{font-size:26px;line-height:1.1;margin-top:6px}
.pauta p{margin:8px 0 0;color:var(--ink-2);font-size:14px}

/* ---- perfil instagram ---- */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
.prow{display:flex;align-items:center;gap:18px}
.ava{width:76px;height:76px;flex:none;border-radius:50%;padding:2.5px;
  background:conic-gradient(from 200deg,#FDC71A,#F2703A,#C13584,#5851DB,#FDC71A)}
.ava i{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid var(--surface);overflow:hidden;background:var(--surface-2)}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ava .ph{width:100%;height:100%;display:grid;place-items:center;font-family:"Archivo Black",sans-serif;
  font-size:22px;color:var(--muted)}
.stats{display:flex;gap:20px;flex:1}
.stats div{text-align:center}
.stats b{display:block;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.bio{margin-top:12px;font-size:14px;white-space:pre-wrap}
.bio b{display:block;font-weight:600}
.handle{font-weight:700;font-size:15px}

/* ---- grade ---- */
.gridhead{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.gridhead h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.gridhead em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;cursor:pointer;background:var(--surface-2);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:11px}
.tile .n{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;
  padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.tile .ty{position:absolute;right:5px;top:5px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .st{position:absolute;left:0;right:0;bottom:0;height:5px}
.tile.is-ok .st{background:var(--ok)}
.tile.is-warn .st{background:var(--warn)}
.tile.is-bad .st{background:var(--bad)}
.tile:not(.is-ok):not(.is-warn):not(.is-bad) .st{background:var(--line-strong)}
.tile.is-bad img,.tile.is-bad .ph{opacity:.5}

.empty{border:1px dashed var(--line-strong);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}

/* ---- post aberto ---- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--ground);display:block;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:env(safe-area-inset-top,0px) 0 0}
.sheet-in{background:var(--ground);width:100%;max-width:540px;margin:0 auto;
  padding:0 0 calc(28px + env(safe-area-inset-bottom,0px))}
@media (min-width:560px){.sheet{background:rgba(10,11,12,.62);padding:24px 16px}
  .sheet-in{border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.34)}}
.navrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.navrow .ghost,.navrow .cta{padding:11px 16px}
.navrow .sp{margin-left:auto}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--ground);display:flex;align-items:center;gap:6px;
  padding:12px 12px;border-bottom:1px solid var(--line)}
.sheet-top b{font-size:13px;font-variant-numeric:tabular-nums}
.iconbtn{background:none;border:0;padding:7px;cursor:pointer;color:var(--ink);border-radius:8px;line-height:0}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn[disabled]{opacity:.3;cursor:default}
.sheet-top .sp{margin-left:auto}

.post{background:var(--surface);border-block:1px solid var(--line)}
.post-head{display:flex;align-items:center;gap:9px;padding:10px 12px}
.post-head .a{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex:none}
.post-head .a img{width:100%;height:100%;object-fit:cover}
.post-head b{font-size:13px;font-weight:600}
.post-head small{display:block;color:var(--muted);font-size:11px}
.media{position:relative;background:#000}
.media img{width:100%;aspect-ratio:var(--ar,1);object-fit:cover}
.media .ph{aspect-ratio:var(--ar,1);display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:13px}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:5px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots i.on{background:#fff}
.carr{position:absolute;inset:0;display:flex}
.carr button{flex:1;background:none;border:0;cursor:pointer}
.acts{display:flex;align-items:center;gap:14px;padding:10px 12px 4px;color:var(--ink)}
.acts .sp{margin-left:auto}
.likes{padding:0 12px;font-size:13px;font-weight:600}
.cap{padding:6px 12px 14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.cap b{font-weight:600}
.cap .tag{color:var(--ig-link)}
.when{padding:0 12px 12px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---- aprovação ---- */
.aprov{padding:18px 12px 4px}
.aprov h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:11px 6px;
  cursor:pointer;display:grid;gap:5px;justify-items:center;font-size:12px;font-weight:600;color:var(--ink-2);
  transition:border-color .12s,background .12s}
.opt svg{opacity:.75}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{color:var(--ink)}
.opt[aria-pressed="true"] svg{opacity:1}
.opt.ok[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.warn[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.opt.bad[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.obs{margin-top:12px}
.obs label{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:10px;padding:10px 11px;font-size:14px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted)}
.saved{font-size:12px;color:var(--ok);margin-top:6px;height:16px}

/* ---- barra de retorno ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px}
.prog{flex:1;min-width:0}
.prog b{display:block;font-size:13px;font-weight:600}
.prog .track{height:5px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden;display:flex}
.prog .track i{display:block;height:100%}
.prog .track .o{background:var(--ok)}.prog .track .w{background:var(--warn)}.prog .track .b{background:var(--bad)}
.cta{flex:none;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:11px 18px;
  font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.cta:hover{filter:brightness(.95)}
.cta[disabled]{opacity:.45;cursor:default;filter:none}

/* ---- modal retorno ---- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,11,12,.62);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal-in{background:var(--surface);border-radius:16px;max-width:520px;width:100%;padding:20px;border:1px solid var(--line)}
.modal-in h2{font-size:19px;margin-bottom:6px}
.modal-in p.sub{color:var(--ink-2);font-size:14px;margin:0 0 14px}
pre.msg{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:240px;
  overflow:auto;font-family:"Barlow",sans-serif;font-size:13px;white-space:pre-wrap;word-break:break-word;margin:0}
.modal-acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---- admin ---- */
.admin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px}
.admin h2{font-size:15px;margin-bottom:2px}
.admin > p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.fields{display:grid;gap:10px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:var(--line);margin:16px 0}
.plist{display:grid;gap:8px}
.prow2{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px}
.prow2 img,.prow2 .ph{width:44px;height:44px;border-radius:7px;object-fit:cover;flex:none;background:var(--line);
  display:grid;place-items:center;font-size:10px;color:var(--muted)}
.prow2 .t{flex:1;min-width:0}
.prow2 .t b{display:block;font-size:13px;font-weight:600}
.prow2 .t span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{background:none;border:1px solid var(--line-strong);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.mini:hover{color:var(--ink);border-color:var(--ink-2)}
.solid{background:var(--ink);color:var(--ground);border:0;border-radius:999px;padding:10px 16px;font-weight:700;
  font-size:14px;cursor:pointer}
.solid[disabled]{opacity:.45;cursor:default}
.meter{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.meter.hot{color:var(--bad);font-weight:600}
.drop{border:1.5px dashed var(--line-strong);border-radius:10px;padding:16px;text-align:center;cursor:pointer;
  font-size:13px;color:var(--muted)}
.drop:hover{border-color:var(--brand);color:var(--ink-2)}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
.foot{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:26px 0 8px;font-weight:600}

.seletor{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seletor label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seletor select{width:auto;flex:1;min-width:140px}
.cod-chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  background:var(--surface-2);border-radius:999px;padding:4px 10px}
.cod-chip.vazio{color:var(--bad)}
.clibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate{max-width:380px;margin:0 auto;padding:44px 0 20px;text-align:center}
.gate-ic{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;background:var(--brand);color:#15171A;
  display:grid;place-items:center}
.gate h1{font-size:22px}
.gate p{color:var(--ink-2);font-size:14px;margin:10px 0 18px}
.gate input{text-align:center;font-family:"Archivo Black","Arial Black",sans-serif;font-size:17px;
  letter-spacing:.12em;text-transform:uppercase;padding:13px 11px}
.gate-err{min-height:20px;font-size:13px;color:var(--bad);font-weight:600;margin:8px 0 12px}
.gate .cta{width:100%;justify-content:center}

.seletor{flex-wrap:wrap}
.selbox{display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
.selbox label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.selbox select{width:auto;flex:1;min-width:110px}
.resumo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px}
.resumo h2{font-size:15px;margin-bottom:8px}
.rlista{display:grid;gap:8px;margin-top:10px}
.rlinha{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rtop b{font-size:13px;font-weight:600;flex:1;min-width:120px}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;
  background:var(--line);color:var(--ink-2);white-space:nowrap}
.chip.is-ok{background:var(--ok-bg);color:var(--ok)}
.chip.is-warn{background:var(--warn-bg);color:var(--warn)}
.chip.is-bad{background:var(--bad-bg);color:var(--bad)}
.chip.vazio{opacity:.7}
.robs{margin-top:7px;font-size:14px;white-space:pre-wrap}
.rquando{margin-top:5px;font-size:11px;color:var(--muted)}
.rcard{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:14px}
.vista{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:2px;gap:2px}
.vista button{border:0;background:none;padding:5px 10px;border-radius:999px;cursor:pointer;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.vista button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (min-width:860px){
  .sheet-in.is-desk{max-width:940px}
  .is-desk .post{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .is-desk .media{grid-column:1;grid-row:1 / span 2;border-right:1px solid var(--line)}
  .is-desk .post-head{grid-column:2;grid-row:1;border-bottom:1px solid var(--line)}
  .is-desk .post-side{grid-column:2;grid-row:2;max-height:64vh;overflow-y:auto}
  .is-desk .cap{padding-top:10px}
}
.vista-nota{font-size:12px;color:var(--muted);padding:8px 12px 0}

var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesAtual(){ var d = new Date(); return MESES[d.getMonth()] + ' ' + d.getFullYear(); }
function mesSeguinte(txt){
  var m = /^([A-Za-zçÇãÃéÉ]+)\s+(\d{4})$/.exec(String(txt||'').trim());
  if(!m) return mesAtual();
  var i = MESES.map(function(x){return x.toLowerCase();}).indexOf(m[1].toLowerCase());
  if(i < 0) return mesAtual();
  var ano = +m[2];
  i++; if(i > 11){ i = 0; ano++; }
  return MESES[i] + ' ' + ano;
}

function resposta(pid){
  if(ehDono()) return RESP[pid] || null;
  var r = R[pid];
  return r && r.status ? {situacao:r.status, obs:r.obs||''} : null;
}
function situacao(pid){ var r = resposta(pid); return r ? r.situacao : ''; }

function enviar(cli, post){
  if(!S.api) return;
  var r = R[post.id] || {};
  try{
    fetch(S.api, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        clienteId: cli.id, cliente: cli.cliente.nome || '',
        postId: post.id, post: (P().mes?P().mes+' · ':'')+(TIPOS[post.tipo]||'Feed')+(post.data?' — '+post.data:''),

      })}).catch(function(){});
  }catch(e){}
}
function carregarRespostas(){
  if(!S.api || !ehDono()) return;
  var c = S.clientes[ativo]; if(!c) return;
  var meu = ++reqId;
  carregando = true; erroResp = ''; pintar();
  fetch(S.api + (S.api.indexOf('?')>-1?'&':'?') + 'cliente=' + encodeURIComponent(c.id) + '&t=' + Date.now(), {redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(meu !== reqId) return;
      RESP = {};
      if(d && d.respostas) d.respostas.forEach(function(x){
        RESP[x.postId] = {situacao: mapa(x.situacao), obs: x.obs, quando: x.quando};
      });
      carregando = false; render();
    })
    .catch(function(){
      if(meu !== reqId) return;
      carregando = false; erroResp = 'não consegui ler a planilha'; pintar();
    });
}
function mapa(t){
  t = String(t||'').toLowerCase();
  if(t.indexOf('aprov')===0) return 'aprovado';
  if(t.indexOf('ajuste')>-1 || t.indexOf('pedir')>-1) return 'ajuste';
  if(t.indexOf('reprov')>-1) return 'reprovado';
  return '';
}
function pintar(){
  var e = id('resp-status'); if(!e) return;

}

}

  copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  lock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',

};
var STATUS = {
  aprovado:{rot:'Aprovado', cls:'is-ok', ic:I.check},
  ajuste:{rot:'Pedir ajuste', cls:'is-warn', ic:I.pencil},
  reprovado:{rot:'Reprovado', cls:'is-bad', ic:I.x}
};
var TIPOS = {feed:'Feed', carrossel:'Carrossel', reels:'Reels', story:'Story'};

function handle(){ var h=C().cliente.handle; return h ? '@'+String(h).replace(/^@/,'') : '@seucliente'; }
function nomeCliente(){ return C().cliente.nome || 'Cliente'; }
function inicial(){ return (nomeCliente()[0]||'C').toUpperCase(); }
function barra(){
  return '<div class="agency"><div class="mark">GM</div><div><b>'+esc(S.agencia.nome)+'</b>'+
    '<span>'+esc(S.agencia.assinatura)+'</span></div><div class="sp"></div>'+
    (ehDono()?'<button class="ghost" id="btn-admin">Painel</button>':'')+
    ((!canEdit && (dono || liberado))?'<button class="ghost" id="btn-sair">Sair</button>':'')+'</div>';
}

/* ---------- tela do código ---------- */
function telaCodigo(erro){
  var h = '<div class="wrap">'+barra()+
    '<div class="gate"><div class="gate-ic">'+I.lock+'</div>'+
    '<h1>Pauta para aprovação</h1>'+
    '<p>Digite o código que a '+esc(S.agencia.nome)+' enviou junto com este link.</p>'+
    '<input type="text" id="cod" autocapitalize="characters" autocomplete="off" placeholder="Ex.: CARLOS">'+
    '<div class="gate-err">'+(erro?esc(erro):'')+'</div>'+
    '<button class="cta" id="cod-ok">Ver a pauta</button></div>'+
    '<div class="foot">'+esc(S.agencia.nome)+' &middot; '+esc(S.agencia.assinatura)+'</div></div>';
  id('app').innerHTML = h;
  var campo = id('cod');
  function tentar(){
    var v = norm(campo.value);
    if(!v){ telaCodigo('Digite o código.'); return; }
    if(S.mestre && norm(S.mestre) === v){ dono = true; ativo = 0; pa = 0; render(); carregarRespostas(); return; }
    for(var i=0;i<S.clientes.length;i++){
      if(S.clientes[i].codigo && norm(S.clientes[i].codigo) === v){
        liberado = S.clientes[i].id; ativo = i; pa = Math.max(0, S.clientes[i].pautas.length-1);
        try{ localStorage.setItem(CLK, liberado); }catch(e){}
        render(); return;
      }
    }
    telaCodigo('Código não encontrado. Confira com a ' + S.agencia.nome + '.');
  }
  id('cod-ok').onclick = tentar;
  campo.onkeydown = function(e){ if(e.key === 'Enter') tentar(); };
  campo.focus();
}

/* ---------- render ---------- */
function render(){
  if(!ehDono() && !cliAtual()){ telaCodigo(); return; }
  var c = C(), t = P(), p = t.posts || [];
  var revisados = p.filter(function(x){return situacao(x.id);}).length;
  var h = '<div class="wrap">' + barra();

  if(S.clientes.length){
    var linhas = '';
    if(ehDono()){
      linhas += '<div class="selbox"><label for="sel-cli">Cliente</label><select id="sel-cli">' +
        S.clientes.map(function(x,i){ return '<option value="'+i+'"'+(i===ativo?' selected':'')+'>'+esc(x.cliente.nome||'Sem nome')+'</option>'; }).join('') +
        '</select></div>';
    }
    if(c.pautas.length > 1 || ehDono()){
      linhas += '<div class="selbox"><label for="sel-pauta">Pauta</label><select id="sel-pauta">' +
        c.pautas.map(function(x,i){ return '<option value="'+i+'"'+(i===Math.min(pa,c.pautas.length-1)?' selected':'')+'>'+esc(x.mes||'Sem mês')+(x.periodo?' · '+esc(x.periodo):'')+'</option>'; }).join('') +
        '</select></div>';
    }
    if(ehDono()) linhas += '<span class="cod-chip'+(c.codigo?'':' vazio')+'">'+(c.codigo?'código '+esc(String(c.codigo).toUpperCase()):'sem código')+'</span>';
    if(linhas) h += '<div class="seletor">'+linhas+'</div>';
  }

  if(!S.clientes.length){
    h += '<div class="pauta"><h1>Nenhum cliente ainda</h1><p>Abra o Painel e cadastre o primeiro.</p></div>';
  } else {
    h += '<div class="pauta">'+(t.mes?'<div class="mes">'+esc(t.mes)+'</div>':'')+
      '<div class="eyebrow">Pauta para aprovação'+(t.periodo?' &middot; '+esc(t.periodo):'')+'</div>'+
      '<h1>'+esc(nomeCliente())+'</h1>'+
      '<p>'+(ehDono()
        ? 'Visão da agência. Abaixo de cada post você vê o que o cliente respondeu.'
        : 'Veja cada post como ele vai aparecer no perfil. Toque em um post para ler a legenda, aprovar ou escrever o que quer mudar.')+'</p></div>';

    h += '<div class="profile"><div class="prow"><div class="ava"><i>'+
      (c.cliente.avatar?'<img src="'+esc(c.cliente.avatar)+'" alt="">':'<div class="ph">'+esc(inicial())+'</div>')+
      '</i></div><div class="stats">'+
      stat(c.cliente.publicacoes || String(p.length), 'publicações')+
      stat(c.cliente.seguidores || '—', 'seguidores')+
      stat(c.cliente.seguindo || '—', 'seguindo')+
      '</div></div>'+
      '<div class="bio"><b>'+esc(handle())+'</b>'+(c.cliente.bio?esc(c.cliente.bio):'<span style="color:var(--muted)">Bio do perfil</span>')+'</div></div>';

    h += '<div class="gridhead"><h2>Grade prevista</h2><em>'+revisados+' de '+p.length+' respondidos</em></div>';
    if(!p.length){
      h += '<div class="empty">Nenhum post nesta pauta ainda.'+(canEdit?' Abra o Painel para adicionar.':'')+'</div>';
    } else {
      h += '<div class="grid">';
      p.forEach(function(post,i){
        var st = situacao(post.id), cls = st ? STATUS[st].cls : '';
        var m = (post.midias&&post.midias[0]) ? '<img src="'+esc(post.midias[0])+'" alt="">' : '<div class="ph">sem arte</div>';
        var ty = post.tipo && post.tipo!=='feed' ? '<span class="ty">'+I[post.tipo]+'</span>' : '';
        h += '<button class="tile '+cls+'" data-open="'+i+'" aria-label="Post '+(i+1)+'">'+m+
             '<span class="n">'+(i+1)+'</span>'+ty+'<span class="st"></span></button>';
      });
      h += '</div>';
    }
  }

  if(ehDono() && S.clientes.length) h += resumoHTML(p);
  if(ehDono()) h += adminHTML();
  h += '<div class="foot">'+esc(S.agencia.nome)+' &middot; '+esc(S.agencia.assinatura)+'</div></div>';

  if(p.length){
    var ok=0,wa=0,bad=0;
    p.forEach(function(x){var s=situacao(x.id); if(s==='aprovado')ok++; else if(s==='ajuste')wa++; else if(s==='reprovado')bad++;});
    var tot=p.length;
    h += '<div class="bar"><div class="bar-in"><div class="prog"><b>'+revisados+' de '+tot+' respondidos</b>'+
         '<div class="track"><i class="o" style="width:'+(ok/tot*100)+'%"></i><i class="w" style="width:'+(wa/tot*100)+'%"></i>'+
         '<i class="b" style="width:'+(bad/tot*100)+'%"></i></div></div>'+
         (ehDono()
           ? '<button class="cta" id="btn-refresh">Atualizar</button>'
           : '<button class="cta" id="btn-retorno"'+(revisados?'':' disabled')+'>'+I.wa+'Enviar retorno</button>')+
         '</div></div>';
  }

  id('app').innerHTML = h;
  wire();
  pintar();
}
function stat(v,l){return '<div><b>'+esc(v)+'</b><span>'+l+'</span></div>';}

function resumoHTML(p){
  var h = '<div class="resumo"><h2>Respostas do cliente</h2>';
  if(!S.api){
    h += '<div class="note" style="margin:0">Ainda sem planilha ligada. Coloque o endereço no Painel para as respostas aparecerem aqui sozinhas.</div></div>';
    return h;
  }
  h += '<div class="meter" id="resp-status"></div>';
  if(!p.length){ return h + '</div>'; }
  var linhas = p.map(function(post,i){
    var r = RESP[post.id];
    var st = r && r.situacao ? r.situacao : '';
    var chip = st ? '<span class="chip '+STATUS[st].cls+'">'+STATUS[st].rot+'</span>' : '<span class="chip vazio">sem resposta</span>';
    return '<div class="rlinha"><div class="rtop"><b>'+(i+1)+'. '+esc(TIPOS[post.tipo]||'Feed')+(post.data?' · '+esc(post.data):'')+'</b>'+chip+'</div>'+
      (r && r.obs ? '<div class="robs">'+esc(r.obs)+'</div>' : '')+
      (r && r.quando ? '<div class="rquando">'+esc(quandoTxt(r.quando))+'</div>' : '')+'</div>';
  }).join('');
  return h + '<div class="rlista">'+linhas+'</div></div>';
}

/* ---------- post aberto ---------- */
var openIdx = -1, carrIdx = 0, vista = 'mobile';
try{ vista = localStorage.getItem('gm-vista') || 'mobile'; }catch(e){}
function openPost(i){
  if(!P().posts[i]) return;
  openIdx = i; carrIdx = 0;
  var el = document.createElement('div');
  el.className = 'sheet'; el.id = 'sheet';
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  drawPost();
}
function closePost(){
  var el = id('sheet'); if(el) el.remove();
  document.body.style.overflow = '';
  openIdx = -1; render();
}
function drawPost(){
  var el = id('sheet'); if(!el) return;
  var lista = P().posts, i = openIdx, p = lista[i], n = lista.length;
  var mids = p.midias || [], tipo = p.tipo || 'feed';

  var media = '';
  if(mids.length){
    media = '<img src="'+esc(mids[Math.min(carrIdx,mids.length-1)])+'" alt="">';
    if(mids.length>1){
      media += '<div class="carr"><button data-carr="-1" aria-label="Anterior"></button><button data-carr="1" aria-label="Próxima"></button></div>';
      media += '<div class="dots">'+mids.map(function(_,k){return '<i class="'+(k===carrIdx?'on':'')+'"></i>';}).join('')+'</div>';
    }
  } else { media = '<div class="ph">arte ainda não enviada</div>'; }

  var h = '<div class="sheet-in'+(vista==='desk'?' is-desk':'')+'" role="dialog" aria-modal="true">';
  h += '<div class="sheet-top"><button class="ghost" id="sh-close" style="display:inline-flex;align-items:center;gap:5px;padding:6px 12px 6px 8px">'+I.prev+'Voltar</button>'+
       '<b>Post '+(i+1)+' de '+n+'</b><div class="sp"></div>'+
       '<div class="vista"><button data-vista="mobile" aria-pressed="'+(vista!=='desk')+'">'+I.cel+'Celular</button>'+
       '<button data-vista="desk" aria-pressed="'+(vista==='desk')+'">'+I.pc+'Computador</button></div>'+
       '<button class="iconbtn" data-nav="-1" aria-label="Post anterior"'+(i===0?' disabled':'')+'>'+I.prev+'</button>'+
       '<button class="iconbtn" data-nav="1" aria-label="Próximo post"'+(i===n-1?' disabled':'')+'>'+I.next+'</button></div>';

  h += '<div class="post"><div class="post-head"><div class="a">'+
       (C().cliente.avatar?'<img src="'+esc(C().cliente.avatar)+'" alt="">':'')+'</div><div><b>'+esc(handle().replace(/^@/,''))+'</b>'+
       '<small>'+esc(TIPOS[tipo]||'Feed')+(p.data?' &middot; '+esc(p.data):'')+'</small></div></div>';
  h += '<div class="media" style="--ar:'+(p.ar||1)+'">'+media+'</div>';
  h += '<div class="post-side">';
  h += '<div class="acts">'+I.heart+I.chat+I.send+'<span class="sp"></span>'+I.save+'</div>';
  h += '<div class="likes">Curtido por <b>'+esc(handle().replace(/^@/,''))+'</b> e outras pessoas</div>';
  h += '<div class="cap"><b>'+esc(handle().replace(/^@/,''))+'</b> '+legenda(p.legenda)+'</div>';
  h += '<div class="when">'+esc(p.data||'data a definir')+'</div></div></div>';
  if(vista === 'desk') h += '<div class="vista-nota">Prévia de computador. Em telas estreitas ela se comporta como no celular.</div>';

  h += '<div class="wrap" style="padding-bottom:20px"><div class="aprov">';
  if(ehDono()){
    var r = RESP[p.id];
    var st = r && r.situacao ? r.situacao : '';
    h += '<h3>Resposta do cliente</h3>';
    h += '<div class="rcard">'+
      (st ? '<span class="chip '+STATUS[st].cls+'">'+STATUS[st].rot+'</span>' : '<span class="chip vazio">ainda não respondeu</span>')+
      (r && r.obs ? '<div class="robs">'+esc(r.obs)+'</div>' : '')+
      (r && r.quando ? '<div class="rquando">'+esc(quandoTxt(r.quando))+'</div>' : '')+
      '</div>';
  } else {
    var rr = R[p.id] || {};
    h += '<h3>O que você decide sobre este post?</h3><div class="opts">'+
      opt('aprovado','ok',rr.status)+opt('ajuste','warn',rr.status)+opt('reprovado','bad',rr.status)+'</div>';
    h += '<div class="obs"><label for="obs-'+esc(p.id)+'">Observações para a '+esc(S.agencia.nome)+'</label>'+
      '<textarea id="obs-'+esc(p.id)+'" rows="4" placeholder="Ex.: trocar a foto, corrigir o telefone, mudar a data da promoção…">'+esc(rr.obs||'')+'</textarea>'+
      '<div class="saved" id="saved-msg"></div></div>';
  }
  h += '<div class="navrow">'+
       (i>0 ? '<button class="ghost" data-nav="-1">Post anterior</button>' : '')+
       '<div class="sp"></div>'+
       (i<n-1 ? '<button class="cta" data-nav="1">Próximo post</button>'
              : '<button class="cta" id="sh-done">Voltar para a grade</button>')+
       '</div></div></div></div>';

  el.innerHTML = h;
  el.scrollTop = 0;
  wirePost();
}
function opt(k,cls,cur){
  return '<button class="opt '+cls+'" data-st="'+k+'" aria-pressed="'+(cur===k)+'">'+STATUS[k].ic+STATUS[k].rot+'</button>';
}
function legenda(t){
  if(!t) return '<span style="color:var(--muted)">Legenda ainda não escrita.</span>';
  return esc(t).replace(/(^|\s)(#[\wÀ-ÿ_.]+)/g,'$1<span class="tag">$2</span>')
               .replace(/(^|\s)(@[\w_.]+)/g,'$1<span class="tag">$2</span>');
}

/* ---------- eventos ---------- */
function wire(){
  var a = id('btn-admin'); if(a) a.onclick = function(){ var el=id('admin'); if(el) el.scrollIntoView({behavior:'smooth'}); };
  var sx = id('btn-sair');
  if(sx) sx.onclick = function(){
    try{ localStorage.removeItem(CLK); }catch(e){}
    liberado = null; dono = false; RESP = {}; ativo = 0; pa = 0; telaCodigo();
  };
  var sc = id('sel-cli'); if(sc) sc.onchange = function(){ ativo = +sc.value; pa = 0; RESP = {}; render(); carregarRespostas(); };
  var sp = id('sel-pauta'); if(sp) sp.onchange = function(){ pa = +sp.value; render(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function(b){
    b.onclick = function(){ openPost(+b.dataset.open); };
  });
  var rt = id('btn-retorno'); if(rt) rt.onclick = abrirRetorno;
  var rf = id('btn-refresh'); if(rf) rf.onclick = carregarRespostas;
  if(ehDono()) wireAdmin();
}
function wirePost(){
  var el = id('sheet');
  el.onclick = function(e){ if(e.target === el) closePost(); };
  id('sh-close').onclick = closePost;
  var fim = id('sh-done'); if(fim) fim.onclick = closePost;
  Array.prototype.forEach.call(el.querySelectorAll('[data-vista]'), function(b){
    b.onclick = function(){ vista = b.dataset.vista; try{ localStorage.setItem('gm-vista', vista); }catch(e){} drawPost(); };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-nav]'), function(b){
    b.onclick = function(){ var d=+b.dataset.nav; if(P().posts[openIdx+d]){ openIdx+=d; carrIdx=0; drawPost(); } };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-carr]'), function(b){
    b.onclick = function(){ var m=P().posts[openIdx].midias||[]; carrIdx=Math.max(0,Math.min(m.length-1,carrIdx+ +b.dataset.carr)); drawPost(); };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-st]'), function(b){
    b.onclick = function(){
      var p = P().posts[openIdx], st = b.dataset.st;
      R[p.id] = R[p.id] || {};
      R[p.id].status = (R[p.id].status === st) ? '' : st;
      saveR(); enviar(C(), p); drawPost(); flash('Resposta enviada');
    };
  });
  var ta = el.querySelector('textarea');
  if(ta){
    var tm;
    ta.oninput = function(){
      clearTimeout(tm);
      tm = setTimeout(function(){
        var p = P().posts[openIdx];
        R[p.id] = R[p.id] || {};
        R[p.id].obs = ta.value;
        saveR(); enviar(C(), p); flash('Observação enviada');
      }, 800);
    };
  }
}
function flash(msg){
  var e = id('saved-msg'); if(!e) return;
  e.textContent = msg;
  setTimeout(function(){ if(e) e.textContent=''; }, 1800);
}
document.addEventListener('keydown', function(e){
  if(openIdx<0) return;
  var lista = P().posts;
  if(e.key === 'Escape') closePost();
  if(e.key === 'ArrowRight' && lista[openIdx+1]){ openIdx++; carrIdx=0; drawPost(); }
  if(e.key === 'ArrowLeft' && lista[openIdx-1]){ openIdx--; carrIdx=0; drawPost(); }
});

/* ---------- retorno ---------- */
function montarTexto(){
  var t = P(), l = [];
  l.push('*Retorno da pauta — '+nomeCliente()+'*');
  if(t.mes) l.push(t.mes+(t.periodo?' — '+t.periodo:''));
  else if(t.periodo) l.push(t.periodo);
  l.push('');
  t.posts.forEach(function(p,i){
    var r = R[p.id] || {};
    l.push('Post '+(i+1)+' — '+(TIPOS[p.tipo]||'Feed')+(p.data?' — '+p.data:''));
    l.push('Situação: '+(r.status ? STATUS[r.status].rot.toUpperCase() : 'SEM RESPOSTA'));
    if(r.obs) l.push('Observações: '+r.obs);
    l.push('');
  });
  var ok = t.posts.filter(function(p){return R[p.id]&&R[p.id].status==='aprovado';}).length;
  l.push('Aprovados: '+ok+' de '+t.posts.length);
  return l.join('\n');
}
function abrirRetorno(){
  var txt = montarTexto();
  var pend = P().posts.filter(function(p){return !(R[p.id]&&R[p.id].status);}).length;
  var num = String(S.agencia.whats||'').replace(/\D/g,'');
  var m = document.createElement('div');
  m.className = 'modal'; m.id = 'modal';
  m.innerHTML = '<div class="modal-in" role="dialog" aria-modal="true"><h2>Enviar retorno</h2>'+
    '<p class="sub">'+(pend? 'Ainda faltam '+pend+' post(s) sem resposta. Você pode enviar assim mesmo e responder o resto depois.' : 'Todos os posts foram respondidos.')+'</p>'+
    '<pre class="msg">'+esc(txt)+'</pre>'+
    '<div class="modal-acts">'+
      (num? '<a class="cta" target="_blank" rel="noopener" href="https://wa.me/'+num+'?text='+encodeURIComponent(txt)+'">'+I.wa+'Abrir no WhatsApp</a>' : '')+
      '<button class="ghost" id="cp">'+I.copy+' Copiar texto</button>'+
      '<button class="ghost" id="fechar-modal">Fechar</button>'+
    '</div></div>';
  document.body.appendChild(m);
  m.onclick = function(e){ if(e.target===m) m.remove(); };
  id('fechar-modal').onclick = function(){ m.remove(); };
  id('cp').onclick = function(){
    var b = id('cp');
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = txt;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); b.textContent='Copiado!'; }catch(e2){ b.textContent='Selecione e copie acima'; }
      ta.remove();
    }
    try{ navigator.clipboard.writeText(txt).then(function(){ b.textContent='Copiado!'; }, fallback); }catch(e){ fallback(); }
  };
}

/* ---------- painel ---------- */
function adminHTML(){

var editIdx = -1, novasMidias = [], novaAr = 1;

function wireAdmin(){
  id('a-novo').onclick = function(){
    S.clientes.push(novoCliente()); ativo = S.clientes.length-1; pa = 0; marcar(); render();
    setTimeout(function(){ var el=id('admin'); if(el) el.scrollIntoView({behavior:'smooth'}); },0);
  };
  var del = id('a-delcli');
  if(del) del.onclick = function(){
    if(!confirm('Excluir este cliente e todas as pautas dele?')) return;
    S.clientes.splice(ativo,1); ativo = 0; pa = 0; marcar(); render();
  };

  ['a-whats','a-api','a-mestre'].forEach(function(k){
    var el = id(k); if(!el) return;
    el.oninput = function(){
      if(k==='a-whats') S.agencia.whats = el.value;
      if(k==='a-api') S.api = el.value.trim();
      if(k==='a-mestre') S.mestre = el.value;
      marcar();
    };
  });
  var bp = id('a-pub'); if(bp) bp.onclick = publicar;
  var bx = id('a-baixar'); if(bx) bx.onclick = baixar;
  var bs = id('a-salvar'); if(bs) bs.onclick = salvarNoSite;
  var sn = id('a-senha'); if(sn) sn.oninput = function(){ try{ sessionStorage.setItem('gm-senha', sn.value); }catch(e){} };
  medir();

  var c = S.clientes[ativo]; if(!c) return;
  var t = c.pautas[Math.min(pa,c.pautas.length-1)];

  ['a-nome','a-handle','a-codigo','a-bio','a-seg','a-sgo','a-mes','a-periodo'].forEach(function(k){
    var el = id(k); if(!el) return;
    el.oninput = function(){
      if(k==='a-nome') c.cliente.nome = el.value;
      if(k==='a-handle') c.cliente.handle = el.value;
      if(k==='a-codigo') c.codigo = el.value;
      if(k==='a-bio') c.cliente.bio = el.value;
      if(k==='a-seg') c.cliente.seguidores = el.value;
      if(k==='a-sgo') c.cliente.seguindo = el.value;
      if(k==='a-mes') t.mes = el.value;
      if(k==='a-periodo') t.periodo = el.value;
      medir(); marcar();
    };
  });

  id('a-novapauta').onclick = function(){
    c.pautas.push(novaPauta(mesSeguinte(t.mes)));
    pa = c.pautas.length-1; marcar(); render();
    setTimeout(function(){ var el=id('admin'); if(el) el.scrollIntoView({behavior:'smooth'}); },0);
  };
  var dp = id('a-delpauta');
  if(dp) dp.onclick = function(){
    if(!confirm('Excluir a pauta de '+(t.mes||'sem mês')+'?')) return;
    c.pautas.splice(pa,1); pa = Math.max(0, c.pautas.length-1); marcar(); render();
  };

  id('drop-ava').onclick = function(){ id('a-ava').click(); };
  id('a-ava').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    comprimir(f, 400, .8, function(d){ c.cliente.avatar = d; marcar(); render();
      setTimeout(function(){var el=id('admin'); if(el)el.scrollIntoView();},0); });
  };
  id('drop-mid').onclick = function(){ id('a-mid').click(); };
  id('a-mid').onchange = function(e){
    var fs = Array.prototype.slice.call(e.target.files);
    if(!fs.length) return;
    novasMidias = []; var done = 0;
    id('mid-prev').textContent = 'processando '+fs.length+' arquivo(s)…';
    fs.forEach(function(f, k){
      comprimir(f, 1080, .74, function(d, ar){
        novasMidias[k] = d; if(k===0 && ar) novaAr = ar; done++;
        if(done === fs.length){
          novasMidias = novasMidias.filter(Boolean);
          id('mid-prev').textContent = novasMidias.length+' arte(s) prontas · '+kb(novasMidias.join('').length);
          if(novasMidias.length>1 && id('a-tipo').value==='feed') id('a-tipo').value='carrossel';
        }
      });
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
    b.onclick = function(){ t.posts.splice(+b.dataset.del,1); marcar(); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function(b){
    b.onclick = function(){ var i=+b.dataset.up; if(i>0){ var x=t.posts[i]; t.posts[i]=t.posts[i-1]; t.posts[i-1]=x; marcar(); render(); } };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function(b){
    b.onclick = function(){
      var i = +b.dataset.edit, p = t.posts[i];
      editIdx = i; novasMidias = (p.midias||[]).slice(); novaAr = p.ar || 1;
      id('a-tipo').value = p.tipo||'feed'; id('a-data').value = p.data||''; id('a-leg').value = p.legenda||'';
      id('mid-prev').textContent = novasMidias.length+' arte(s) atuais';
      id('form-titulo').textContent = 'Editando post '+(i+1);
      id('a-add').textContent = 'Salvar post '+(i+1);
      id('a-cancel').hidden = false;
      id('form-titulo').scrollIntoView({behavior:'smooth'});
    };
  });
  id('a-cancel').onclick = resetForm;
  id('a-add').onclick = function(){
    var leg = id('a-leg').value, tipo = id('a-tipo').value, data = id('a-data').value;
    if(!novasMidias.length && !leg.trim()){ id('mid-prev').textContent = 'Escolha uma arte ou escreva a legenda.'; return; }
    if(editIdx >= 0){
      var p = t.posts[editIdx];
      p.tipo=tipo; p.data=data; p.legenda=leg; p.midias=novasMidias.slice(); p.ar=novaAr;
    } else {
      t.posts.push({id:uid('p'), tipo:tipo, data:data, legenda:leg, midias:novasMidias.slice(), ar:novaAr});
    }
    resetForm(); marcar(); render();
    setTimeout(function(){ var el=id('admin'); if(el) el.scrollIntoView({behavior:'smooth'}); },0);
  };
}
function resetForm(){
  editIdx = -1; novasMidias = []; novaAr = 1;
  if(id('a-leg')){ id('a-leg').value=''; id('a-data').value=''; id('a-tipo').value='feed';
    id('mid-prev').textContent=''; id('form-titulo').textContent='Novo post';
    id('a-add').textContent='Adicionar à pauta'; id('a-cancel').hidden = true; }
}
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB'; }
function medir(){
  var el = id('a-meter'); if(!el) return;
  var n = JSON.stringify(S).length;
  el.textContent = 'Peso total da página: '+kb(n)+' de 14 MB';
  el.className = 'meter' + (n > 11000000 ? ' hot' : '');
}
var pendente = false;
function marcar(){ pendente = true; var s=id('a-status'); if(s){ s.textContent='alterações não publicadas'; s.className='meter hot'; } }

function comprimir(file, max, q, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var im = new Image();
    im.onload = function(){
      var w = im.width, h = im.height, r = Math.min(1, max/Math.max(w,h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w*r); cv.height = Math.round(h*r);
      var cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg', q), Math.round(cv.width/cv.height*1000)/1000);
    };
    im.onerror = function(){ cb(null, 1); };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function buildDoc(state){
  var json = JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
    '<title>'+esc(document.title)+'</title>'+
    id('app-fonts').outerHTML + id('app-css').outerHTML +
    '</head><body>'+ SHELL +
    '<script type="application/json" id="app-state">'+ json +'<\/script>'+
    id('app-js').outerHTML +
    '</body></html>';
}
function publicar(){
  var s = id('a-status'), b = id('a-pub');
  if(!artifactCap){ s.textContent = 'não deu para publicar daqui'; s.className='meter hot'; return; }
  b.disabled = true; s.textContent = 'publicando…'; s.className = 'meter';
  artifactCap.publish(buildDoc(S)).then(function(){
    pendente = false; s.textContent = 'publicado'; s.className = 'meter';
  }, function(err){
    b.disabled = false;
    var c2 = err && err.code;
    if(c2 === 'too_large') s.textContent = 'página pesada demais — tire ou troque alguma arte';
    else if(c2 === 'not_writer' || c2 === 'not_granted') s.textContent = 'esta visualização é somente leitura';
    else if(c2 === 'conflict') s.textContent = 'a página mudou por outro caminho — recarregando';
    else if(c2 === 'rate_limited') s.textContent = 'publicando rápido demais — espere alguns segundos';
    else s.textContent = 'falhou ao publicar — tente de novo';
    s.className = 'meter hot';
  });
}
function senhaGuardada(){ try{ return sessionStorage.getItem('gm-senha') || ''; }catch(e){ return ''; } }
function salvarNoSite(){
  var s = id('a-status'), b = id('a-salvar');
  var senha = (id('a-senha')||{}).value || '';
  if(!senha){ s.textContent = 'preencha a senha de publicação'; s.className = 'meter hot'; return; }
  try{ sessionStorage.setItem('gm-senha', senha); }catch(e){}
  b.disabled = true; s.textContent = 'publicando no site…'; s.className = 'meter';
  fetch(S.api, {method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({acao:'salvar', senha:senha, html: buildDoc(S)})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      b.disabled = false;
      if(d && d.ok){ pendente = false; s.textContent = 'publicado — o site atualiza em até um minuto'; s.className = 'meter'; }
      else {
        var e = (d && d.erro) || 'erro';
        if(e === 'senha'){ try{ sessionStorage.removeItem('gm-senha'); }catch(x){} s.textContent = 'senha incorreta'; }
        else s.textContent = 'não deu para publicar: ' + e;
        s.className = 'meter hot';
      }
    })
    .catch(function(){ b.disabled = false; s.textContent = 'falha de conexão ao publicar'; s.className = 'meter hot'; });
}
function baixar(){
  var s = id('a-status');
  if(!dlCap){ s.textContent = 'download indisponível nesta visualização'; s.className='meter hot'; return; }
  s.textContent = 'gerando arquivo…'; s.className = 'meter';
  dlCap.save({filename:'index.html', data: buildDoc(S)}).then(function(){
    s.textContent = 'arquivo salvo — arraste no Netlify'; s.className = 'meter';
  }, function(){ s.textContent = 'download cancelado'; s.className='meter'; });
}
window.addEventListener('beforeunload', function(e){ if(pendente && canEdit){ e.preventDefault(); e.returnValue=''; } });

/* ---------- arranque ---------- */
render();
if(window.claude && window.claude.use){
  window.claude.use('user').then(function(u){
    var pode = false;
    try{ pode = !!(u && (u.canEdit() || u.isOwner())); }catch(e){}
    if(pode && !canEdit){ canEdit = true; render(); carregarRespostas(); }
  }, function(){});
  window.claude.use('artifact').then(function(a){ artifactCap = a; }, function(){});
  window.claude.use('downloads').then(function(d){ dlCap = d; }, function(){});
}
})();
